[package]
name = "foa-workbench"
version = "0.7.0"
edition = "2021"
rust-version = "1.95"
description = "缄默之陨 · 存档与录像数据工作台"
license = "MIT"
publish = false

[features]
default = []
role-ban-only = []

[dependencies]
dirs = "7.0.0"
flate2 = "1.1.10"
bzip2 = "0.6.1"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "clipboard", "links"] }
num-bigint = "0.5.1"
quick-xml = "0.42.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
as_conversions = "deny"
clone_on_ref_ptr = "deny"
cognitive_complexity = "deny"
redundant_clone = "deny"

